<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cake Merge — Аркада</title>
    <style>
      html, body {
        margin: 0; width: 100%; height: 100%; overflow: hidden;
        background: #F4E9D7; font-family: 'Nunito', system-ui, sans-serif;
        touch-action: none; user-select: none; -webkit-user-select: none;
      }
      #app { width: 100%; height: 100%; }
      .panel {
        position: fixed; z-index: 10; background: #FAFAFA; border-radius: 16px;
        box-shadow: 0 6px 20px rgba(13, 13, 13, 0.12); color: #0D0D0D;
      }
      #hud { top: 14px; left: 14px; padding: 12px 18px; font-weight: 800; font-size: 18px; }
      #hud b { color: #B85C2E; }
      #tools { top: 14px; right: 14px; padding: 8px; display: flex; gap: 8px; }
      #tools button {
        width: 52px; height: 52px; border: none; border-radius: 14px; font-size: 24px;
        background: #FBB02D; box-shadow: 0 4px 0 rgba(13, 13, 13, 0.18);
        transition: transform 0.08s ease; cursor: pointer;
      }
      #tools button:active { transform: scale(0.92); }
      #toast {
        position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-8px);
        z-index: 20; padding: 12px 20px; border-radius: 14px; background: #0D0D0D;
        color: #FAFAFA; font-weight: 700; font-size: 15px; opacity: 0; pointer-events: none;
        transition: all 0.2s ease;
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      #overlay {
        position: fixed; inset: 0; z-index: 30; background: rgba(13, 13, 13, 0.5);
        display: none; align-items: center; justify-content: center;
      }
      #overlay.show { display: flex; }
      #overlayCard {
        background: #FAFAFA; border-radius: 24px; padding: 32px 36px; text-align: center;
        max-width: 320px; color: #0D0D0D; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      }
      #overlayText { font-weight: 800; font-size: 22px; white-space: pre-line; margin-bottom: 20px; }
      #overlayBtn {
        border: none; border-radius: 14px; padding: 14px 32px; font-size: 18px; font-weight: 800;
        background: #FBB02D; color: #0D0D0D; box-shadow: 0 4px 0 rgba(13, 13, 13, 0.18); cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="panel"><span>Ходов: <b id="moves">0</b> | Собрано: <b id="completed">0</b>/9</span></div>
    <div id="tools" class="panel">
      <button id="toSort" title="Сортировка тортов «Кондитерская»">🎂</button>
      <button id="restart" title="Заново">🔄</button>
    </div>
    <div id="toast"></div>
    <div id="overlay">
      <div id="overlayCard">
        <div id="overlayText"></div>
        <button id="overlayBtn"></button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
